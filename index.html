const KEY = "dietetica-v1";
const fmt = n => "$ " + Number(n).toLocaleString("es-AR");

function loadData() {
  try {
    const saved = localStorage.getItem(KEY);
    return saved ? JSON.parse(saved) : DATA;
  } catch { return DATA; }
}
function saveData(products) {
  try { localStorage.setItem(KEY, JSON.stringify(products)); } catch {}
}

function CatBadge({ cat }) {
  const s = CAT_STYLE[cat] || { bg:"#eee", color:"#555" };
  return (
    <span style={{
      background:s.bg, color:s.color,
      fontSize:11, fontWeight:600,
      padding:"2px 9px", borderRadius:20, whiteSpace:"nowrap"
    }}>{cat}</span>
  );
}

function Modal({ product, onSave, onClose }) {
  const [form, setForm] = useState(
    product ? { ...product } : { nombre:"", categoria:"Semillas", precio:"", notas:"" }
  );
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const valid = form.nombre.trim() && Number(form.precio) > 0;

  return (
    <div className="overlay">
      <div className="modal">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <span style={{ fontSize:16, fontWeight:700 }}>
            {product ? "✏️ Editar producto" : "➕ Nuevo producto"}
          </span>
          <button onClick={onClose} style={{
            background:"#f3f3f3", border:"none", borderRadius:8,
            width:32, height:32, fontSize:18, cursor:"pointer"
          }}>✕</button>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <div>
            <label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>Nombre</label>
            <input value={form.nombre} onChange={e => set("nombre", e.target.value)} placeholder="Ej: Semillas de Chía" />
          </div>
          <div>
            <label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>Categoría</label>
            <select value={form.categoria} onChange={e => set("categoria", e.target.value)}>
              {CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>Precio ($)</label>
            <input type="number" value={form.precio} onChange={e => set("precio", e.target.value)} placeholder="Ej: 8500" />
          </div>
          <div>
            <label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>Notas (opcional)</label>
            <textarea value={form.notas} onChange={e => set("notas", e.target.value)}
              placeholder="Marca, presentación, observaciones..." rows={2}
              style={{ resize:"vertical" }} />
          </div>
        </div>
        <div style={{ display:"flex", gap:8, marginTop:18, justifyContent:"flex-end" }}>
          <button onClick={onClose} style={{
            padding:"8px 16px", borderRadius:8,
            border:"1px solid #ddd", background:"#fff", fontSize:13
          }}>Cancelar</button>
          <button disabled={!valid} onClick={() => onSave({ ...form, precio: Number(form.precio) })}
            style={{
              padding:"8px 18px", borderRadius:8, border:"none",
              background: valid ? "#2d5016" : "#bbb",
              color:"#fff", fontSize:13, fontWeight:600,
              cursor: valid ? "pointer" : "default"
            }}>
            {product ? "Guardar cambios" : "Agregar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [products, setProducts] = useState(loadData);
  const [search, setSearch]     = useState("");
  const [cat, setCat]           = useState("Todas");
  const [sortBy, setSortBy]     = useState("nombre");
  const [modal, setModal]       = useState(null);
  const [deleting, setDeleting] = useState(null);

  useEffect(() => saveData(products), [products]);

  const filtered = products
    .filter(p => {
      const ms = (p.nombre + " " + p.notas).toLowerCase().includes(search.toLowerCase());
      const mc = cat === "Todas" || p.categoria === cat;
      return ms && mc;
    })
    .sort((a, b) => sortBy === "precio"
      ? a.precio - b.precio
      : a.nombre.localeCompare(b.nombre, "es")
    );

  function save(p) {
    if (p.id) {
      setProducts(prev => prev.map(x => x.id === p.id ? p : x));
    } else {
      setProducts(prev => [...prev, { ...p, id: Date.now() }]);
    }
    setModal(null);
  }

  function del(id) {
    setProducts(prev => prev.filter(x => x.id !== id));
    setDeleting(null);
  }

  const avg = Math.round(products.reduce((a, p) => a + p.precio, 0) / products.length);
  const cats = new Set(products.map(p => p.categoria)).size;

  return (
    <div style={{ maxWidth:820, margin:"0 auto", padding:"24px 16px" }}>

      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:22, flexWrap:"wrap", gap:12 }}>
        <div>
          <h1 style={{ fontSize:22, fontWeight:800, color:"#1a3a08", margin:0 }}>🌿 Catálogo Dietética</h1>
          <p style={{ fontSize:12, color:"#999", marginTop:4 }}>Lista de precios — uso interno</p>
        </div>
        <button onClick={() => setModal({})} style={{
          background:"#2d5016", color:"#fff", border:"none",
          borderRadius:10, padding:"10px 18px",
          fontWeight:700, fontSize:13, cursor:"pointer"
        }}>＋ Agregar producto</button>
      </div>

      {/* Stats */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:22 }}>
        {[
          { label:"Productos totales", val: products.length },
          { label:"Categorías",        val: cats },
          { label:"Precio promedio",   val: fmt(avg) },
        ].map(s => (
          <div key={s.label} style={{ background:"#ede9e0", borderRadius:10, padding:"12px 16px" }}>
            <div style={{ fontSize:11, color:"#999", marginBottom:2 }}>{s.label}</div>
            <div style={{ fontSize:20, fontWeight:800, color:"#2d5016" }}>{s.val}</div>
          </div>
        ))}
      </div>

      {/* Buscar + Ordenar */}
      <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <input
          value={search} onChange={e => setSearch(e.target.value)}
          placeholder="🔍  Buscar producto o marca..."
          style={{ flex:1, minWidth:180 }}
        />
        <select value={sortBy} onChange={e => setSortBy(e.target.value)}
          style={{ width:"auto", minWidth:140 }}>
          <option value="nombre">Ordenar: A → Z</option>
          <option value="precio">Ordenar: precio ↑</option>
        </select>
      </div>

      {/* Filtros de categoría */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:16 }}>
        {["Todas", ...CATEGORIES].map(c => {
          const active = cat === c;
          const s = CAT_STYLE[c];
          return (
            <button key={c} onClick={() => setCat(c)} style={{
              padding:"4px 13px", borderRadius:20, fontSize:12,
              fontWeight: active ? 700 : 400,
              background: active ? (s ? s.bg : "#2d5016") : "#fff",
              color:       active ? (s ? s.color : "#fff") : "#888",
              border: `1px solid ${active ? (s ? s.color : "#2d5016") : "#ddd"}`,
              cursor:"pointer", transition:"all .12s"
            }}>{c}</button>
          );
        })}
      </div>

      {/* Contador */}
      <div style={{ fontSize:12, color:"#bbb", marginBottom:10 }}>
        {filtered.length} {filtered.length === 1 ? "producto" : "productos"}
        {cat !== "Todas" ? ` en ${cat}` : ""}
        {search ? ` · búsqueda: "${search}"` : ""}
      </div>

      {/* Tabla */}
      <div style={{ border:"1px solid #e5e0d8", borderRadius:12, overflow:"hidden", background:"#fff" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", tableLayout:"fixed" }}>
          <thead>
            <tr style={{ background:"#f0ede6" }}>
              <th style={{ textAlign:"left",  padding:"10px 16px", fontSize:11, fontWeight:700, color:"#aaa", width:"44%" }}>PRODUCTO</th>
              <th style={{ textAlign:"left",  padding:"10px 8px",  fontSize:11, fontWeight:700, color:"#aaa", width:"24%" }}>CATEGORÍA</th>
              <th style={{ textAlign:"right", padding:"10px 16px", fontSize:11, fontWeight:700, color:"#aaa", width:"20%" }}>PRECIO</th>
              <th style={{ width:"12%" }}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr>
                <td colSpan={4} style={{ padding:40, textAlign:"center", color:"#ccc", fontSize:14 }}>
                  No se encontraron productos
                </td>
              </tr>
            ) : filtered.map((p, i) => (
              <tr key={p.id} style={{ borderTop:"1px solid #f0ede6", background: i%2===0 ? "#fff" : "#faf8f5" }}>
                <td style={{ padding:"10px 16px" }}>
                  <div style={{ fontSize:13, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                    {p.nombre}
                  </div>
                  {p.notas && (
                    <div style={{ fontSize:11, color:"#bbb", marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                      {p.notas}
                    </div>
                  )}
                </td>
                <td style={{ padding:"10px 8px" }}><CatBadge cat={p.categoria} /></td>
                <td style={{ padding:"10px 16px", textAlign:"right", fontSize:14, fontWeight:800, color:"#2d5016", whiteSpace:"nowrap" }}>
                  {fmt(p.precio)}
                </td>
                <td style={{ padding:"10px 10px" }}>
                  <div style={{ display:"flex", gap:4, justifyContent:"flex-end" }}>
                    <button onClick={() => setModal(p)} title="Editar"
                      style={{ background:"#f3f3f3", border:"none", borderRadius:7, padding:"5px 8px", cursor:"pointer", fontSize:14 }}>✏️</button>
                    <button onClick={() => setDeleting(p)} title="Eliminar"
                      style={{ background:"#fff0f0", border:"none", borderRadius:7, padding:"5px 8px", cursor:"pointer", fontSize:14 }}>🗑️</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Modal editar/agregar */}
      {modal !== null && (
        <Modal product={modal.id ? modal : null} onSave={save} onClose={() => setModal(null)} />
      )}

      {/* Confirmar eliminación */}
      {deleting && (
        <div className="overlay">
          <div className="modal" style={{ maxWidth:360 }}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:8 }}>Eliminar producto</div>
            <div style={{ fontSize:13, color:"#666", marginBottom:20 }}>
              ¿Seguro que querés eliminar <strong>{deleting.nombre}</strong>?
            </div>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={() => setDeleting(null)} style={{
                padding:"8px 16px", borderRadius:8,
                border:"1px solid #ddd", background:"#fff", cursor:"pointer", fontSize:13
              }}>Cancelar</button>
              <button onClick={() => del(deleting.id)} style={{
                padding:"8px 18px", borderRadius:8, border:"none",
                background:"#A32D2D", color:"#fff", cursor:"pointer", fontSize:13, fontWeight:600
              }}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
