* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f2ec; color: #222; }
input, select, textarea {
  font-family: inherit; font-size: 14px;
  border: 1px solid #ddd; border-radius: 8px;
  padding: 9px 12px; background: #fff; color: #222;
  outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: #2d5016; }
button { font-family: inherit; cursor: pointer; }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.modal {
  background: #fff; border-radius: 14px; width: 100%;
  max-width: 440px; padding: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
tr:hover td { background: #f0ede6 !important; }
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 20px;
  border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 9999;
  animation: fadeup .25s ease;
}
@keyframes fadeup {
  from { opacity:0; transform: translateX(-50%) translateY(8px); }
  to   { opacity:1; transform: translateX(-50%) translateY(0); }
}
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
.pub-wrap { max-width:680px; margin:0 auto; background:#fdf8f2; min-height:100vh; padding:0 0 90px; }
.pub-header { background:#2d5016; padding:36px 32px 28px; text-align:center; }
.pub-header h1 { font-family:'Playfair Display',Georgia,serif; font-size:32px; font-weight:800; color:#f5f0e8; margin-bottom:8px; }
.pub-header p { font-size:13px; color:#a8c98a; font-weight:500; margin-top:4px; }
.pub-section { padding:0 24px; margin-top:28px; }
.pub-section-title {
  font-size:11px; font-weight:700; letter-spacing:2px; color:#2d5016;
  text-transform:uppercase; padding-bottom:8px;
  border-bottom:1.5px solid #d8e8c8; margin-bottom:4px;
  display:flex; align-items:center; gap:8px;
}
.pub-item { display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px dashed #e8e0d4; }
.pub-item:last-child { border-bottom:none; }
.pub-item-left { flex:1; padding-right:16px; }
.pub-item-name { font-size:14px; font-weight:500; color:#2a2a2a; line-height:1.3; }
.pub-item-note { font-size:11px; color:#aaa; margin-top:2px; }
.pub-item-price { font-size:15px; font-weight:700; color:#2d5016; white-space:nowrap; }
.pub-footer { margin:40px 24px 0; background:#2d5016; border-radius:14px; padding:24px; color:#f5f0e8; }
.pub-footer h3 { font-family:'Playfair Display',Georgia,serif; font-size:18px; margin-bottom:14px; }
.pub-footer p { font-size:13px; line-height:1.9; color:#c5dfa8; }
.pub-footer strong { color:#f5f0e8; }
.share-bar {
  position:fixed; bottom:0; left:0; right:0; background:#fff;
  border-top:1px solid #e5e0d8; padding:12px 16px;
  display:flex; gap:8px; justify-content:center;
  box-shadow:0 -4px 20px rgba(0,0,0,0.08); z-index:100;
}
.share-bar button { flex:1; max-width:200px; padding:11px 12px; border-radius:10px; border:none; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
.btn-wp { background:#25D366; color:#fff; }
.btn-cp { background:#2d5016; color:#fff; }
.btn-pr { background:#f0ede6; color:#2d5016; border:1px solid #c5d8b0 !important; }
@media print {
  .share-bar { display:none !important; }
  body { background:white; }
  .pub-wrap { max-width:100%; }
  .pub-header, .pub-footer { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>

];

const KEYS = { products:"dietetica-v1", categories:"dietetica-cats-v1" };
const fmt = n => "$ " + Number(n).toLocaleString("es-AR");

function load(key, fallback) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
  catch { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function encodeState(products, categories) {
  return btoa(unescape(encodeURIComponent(JSON.stringify({ products, categories }))));
}
function decodeState(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch { return null; }
}
function isPublicView() {
  return new URLSearchParams(window.location.search).get("vista") === "publica";
}
function getStateFromURL() {
  const hash = window.location.hash.slice(1);
  return hash ? decodeState(hash) : null;
}
function getCatStyle(cat) { return CAT_STYLE[cat] || DEFAULT_CAT_STYLE; }
function getCatEmoji(cat) { return CAT_EMOJI[cat] || "📦"; }

function CatBadge({ cat }) {
  const s = getCatStyle(cat);
  return <span style={{ background:s.bg, color:s.color, fontSize:11, fontWeight:600, padding:"2px 9px", borderRadius:20, whiteSpace:"nowrap" }}>{cat}</span>;
}

function CatModal({ categories, products, onSave, onClose }) {
  const [nombre, setNombre] = useState("");
  const [emoji,  setEmoji]  = useState("📦");
  const [delCat, setDelCat] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const EMOJIS = ["📦","🍫","🫖","🥗","🌿","🍋","🫒","🧴","🥩","🍞","🧁","🥛","🫙","🌶️","🥕","🍯"];
  const trimmed = nombre.trim();
  const exists  = categories.some(c => c.toLowerCase() === trimmed.toLowerCase());
  const valid   = trimmed.length > 0 && !exists;

  function handleDelete(cat) {
    const hasProducts = products.some(p => p.categoria === cat);
    if (hasProducts) { setDelCat({ cat, blocked:true }); }
    else { setDelCat({ cat, blocked:false }); setConfirmDel(true); }
  }

  return (
    <div className="overlay">
      <div className="modal" style={{ maxWidth:480 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <span style={{ fontSize:16, fontWeight:700 }}>🗂️ Gestionar categorías</span>
          <button onClick={onClose} style={{ background:"#f3f3f3", border:"none", borderRadius:8, width:32, height:32, fontSize:18 }}>✕</button>
        </div>
        <div style={{ background:"#f7f5f0", borderRadius:10, padding:16, marginBottom:18 }}>
          <div style={{ fontSize:12, color:"#888", fontWeight:600, marginBottom:10 }}>NUEVA CATEGORÍA</div>
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <input value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Ej: Chocolates Amargos" style={{ flex:1 }}
              onKeyDown={e => e.key==="Enter" && valid && onSave("add", { nombre:trimmed, emoji })} />
            <select value={emoji} onChange={e => setEmoji(e.target.value)}
              style={{ width:64, textAlign:"center", fontSize:18, padding:"8px 4px", cursor:"pointer" }}>
              {EMOJIS.map(em => <option key={em} value={em}>{em}</option>)}
            </select>
          </div>
          {exists && <div style={{ fontSize:12, color:"#c0392b", marginBottom:8 }}>⚠️ Ya existe una categoría con ese nombre</div>}
          <button disabled={!valid} onClick={() => onSave("add", { nombre:trimmed, emoji })}
            style={{ width:"100%", padding:"9px", borderRadius:8, border:"none", background:valid?"#2d5016":"#ccc", color:"#fff", fontWeight:600, fontSize:13, cursor:valid?"pointer":"default" }}>
            ＋ Agregar categoría
          </button>
        </div>
        <div style={{ fontSize:12, color:"#888", fontWeight:600, marginBottom:8 }}>CATEGORÍAS ACTUALES</div>
        <div style={{ maxHeight:260, overflowY:"auto", display:"flex", flexDirection:"column", gap:6 }}>
          {categories.map(cat => {
            const count = products.filter(p => p.categoria === cat).length;
            const isDefault = DEFAULT_CATEGORIES.includes(cat);
            return (
              <div key={cat} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", background:"#faf8f5", borderRadius:8, border:"1px solid #eee" }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <span style={{ fontSize:18 }}>{getCatEmoji(cat)}</span>
                  <div>
                    <div style={{ fontSize:13, fontWeight:500 }}>{cat}</div>
                    <div style={{ fontSize:11, color:"#bbb" }}>{count} {count===1?"producto":"productos"}</div>
                  </div>
                </div>
                {!isDefault
                  ? <button onClick={() => handleDelete(cat)} style={{ background:"#fff0f0", border:"none", borderRadius:7, padding:"5px 10px", cursor:"pointer", fontSize:13, color:"#c0392b", fontWeight:600 }}>🗑️</button>
                  : <span style={{ fontSize:11, color:"#ccc" }}>base</span>
                }
              </div>
            );
          })}
        </div>
        {confirmDel && delCat && (
          <div style={{ marginTop:14, background:"#fff5f5", border:"1px solid #f5c6cb", borderRadius:10, padding:14 }}>
            <div style={{ fontSize:13, fontWeight:600, marginBottom:6, color:"#c0392b" }}>¿Eliminar "{delCat.cat}"?</div>
            <div style={{ fontSize:12, color:"#666", marginBottom:12 }}>Esta categoría no tiene productos. Se eliminará permanentemente.</div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => { setConfirmDel(false); setDelCat(null); }} style={{ flex:1, padding:"7px", borderRadius:8, border:"1px solid #ddd", background:"#fff", fontSize:13 }}>Cancelar</button>
              <button onClick={() => { onSave("delete", delCat.cat); setConfirmDel(false); setDelCat(null); }}
                style={{ flex:1, padding:"7px", borderRadius:8, border:"none", background:"#c0392b", color:"#fff", fontSize:13, fontWeight:600 }}>Eliminar</button>
            </div>
          </div>
        )}
        {delCat?.blocked && (
          <div style={{ marginTop:14, background:"#fffbe6", border:"1px solid #ffe58f", borderRadius:10, padding:14 }}>
            <div style={{ fontSize:13, fontWeight:600, color:"#856404", marginBottom:4 }}>No se puede eliminar</div>
            <div style={{ fontSize:12, color:"#856404" }}>"{delCat.cat}" tiene productos asignados. Reasignalos primero.</div>
            <button onClick={() => setDelCat(null)} style={{ marginTop:10, padding:"6px 14px", borderRadius:8, border:"1px solid #ddd", background:"#fff", fontSize:12, cursor:"pointer" }}>Entendido</button>
          </div>
        )}
      </div>
    </div>
  );
}

function Catalogo() {
  const [products,   setProducts]   = useState(() => load(KEYS.products,   DEFAULT_PRODUCTS));
  const [categories, setCategories] = useState(() => load(KEYS.categories, DEFAULT_CATEGORIES));
  const [search,     setSearch]     = useState("");
  const [cat,        setCat]        = useState("Todas");
  const [sortBy,     setSortBy]     = useState("nombre");
  const [modal,      setModal]      = useState(null);
  const [catModal,   setCatModal]   = useState(false);
  const [deleting,   setDeleting]   = useState(null);
  const [toast,      setToast]      = useState(null);

  useEffect(() => save(KEYS.products,   products),   [products]);
  useEffect(() => save(KEYS.categories, categories), [categories]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2000); }

  function openPublicView() {
    const base = window.location.origin + window.location.pathname;
    window.open(`${base}?vista=publica#${encodeState(products, categories)}`, "_blank");
  }

  function handleCatAction(action, payload) {
    if (action === "add") {
      setCategories(prev => [...prev, payload.nombre]);
      if (payload.emoji) CAT_EMOJI[payload.nombre] = payload.emoji;
      showToast(`✅ Categoría "${payload.nombre}" creada`);
    } else if (action === "delete") {
      setCategories(prev => prev.filter(c => c !== payload));
      if (cat === payload) setCat("Todas");
      showToast("🗑️ Categoría eliminada");
    }
  }

  const filtered = products
    .filter(p => {
      const ms = (p.nombre + " " + p.notas).toLowerCase().includes(search.toLowerCase());
      const mc = cat === "Todas" || p.categoria === cat;
      return ms && mc;
    })
    .sort((a,b) => sortBy==="precio" ? a.precio-b.precio : a.nombre.localeCompare(b.nombre,"es"));

  function saveProduct(p) {
    if (p.id) setProducts(prev => prev.map(x => x.id===p.id ? p : x));
    else setProducts(prev => [...prev, { ...p, id: Date.now() }]);
    setModal(null); showToast("✅ Guardado");
  }
  function del(id) {
    setProducts(prev => prev.filter(x => x.id!==id));
    setDeleting(null); showToast("🗑️ Eliminado");
  }

  const avg  = products.length ? Math.round(products.reduce((a,p) => a+p.precio,0)/products.length) : 0;
  const cats = new Set(products.map(p => p.categoria)).size;

  return (
    <div style={{ maxWidth:820, margin:"0 auto", padding:"24px 16px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:22, flexWrap:"wrap", gap:12 }}>
        <div>
          <h1 style={{ fontSize:22, fontWeight:800, color:"#1a3a08", margin:0 }}>🌿 Catálogo Dietética</h1>
          <p style={{ fontSize:12, color:"#999", marginTop:4 }}>Lista de precios — uso interno</p>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={openPublicView} style={{ background:"#f0f7e8", color:"#2d5016", border:"1.5px solid #2d5016", borderRadius:10, padding:"10px 14px", fontWeight:700, fontSize:13 }}>
            👁️ Ver lista para compartir
          </button>
          <button onClick={() => setCatModal(true)} style={{ background:"#fff", color:"#555", border:"1px solid #ddd", borderRadius:10, padding:"10px 14px", fontWeight:600, fontSize:13 }}>
            🗂️ Categorías
          </button>
          <button onClick={() => setModal({})} style={{ background:"#2d5016", color:"#fff", border:"none", borderRadius:10, padding:"10px 14px", fontWeight:700, fontSize:13 }}>
            ＋ Producto
          </button>
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:22 }}>
        {[{label:"Productos",val:products.length},{label:"Categorías",val:cats},{label:"Precio prom.",val:fmt(avg)}].map(s => (
          <div key={s.label} style={{ background:"#ede9e0", borderRadius:10, padding:"12px 16px" }}>
            <div style={{ fontSize:11, color:"#999", marginBottom:2 }}>{s.label}</div>
            <div style={{ fontSize:20, fontWeight:800, color:"#2d5016" }}>{s.val}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍  Buscar producto o marca..." style={{ flex:1, minWidth:180 }} />
        <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ width:"auto", minWidth:130 }}>
          <option value="nombre">A → Z</option>
          <option value="precio">Precio ↑</option>
        </select>
      </div>

      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:16 }}>
        {["Todas",...categories].map(c => {
          const active = cat===c; const s = getCatStyle(c);
          return (
            <button key={c} onClick={() => setCat(c)} style={{
              padding:"4px 13px", borderRadius:20, fontSize:12, fontWeight:active?700:400,
              background:active?(s?s.bg:"#2d5016"):"#fff",
              color:active?(s?s.color:"#fff"):"#888",
              border:`1px solid ${active?(s?s.color:"#2d5016"):"#ddd"}`, cursor:"pointer"
            }}>{c}</button>
          );
        })}
      </div>

      <div style={{ fontSize:12, color:"#bbb", marginBottom:10 }}>
        {filtered.length} {filtered.length===1?"producto":"productos"}{cat!=="Todas"?` en ${cat}`:""}{search?` · "${search}"`:""}
      </div>

      <div style={{ border:"1px solid #e5e0d8", borderRadius:12, overflow:"hidden", background:"#fff" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", tableLayout:"fixed" }}>
          <thead>
            <tr style={{ background:"#f0ede6" }}>
              <th style={{ textAlign:"left",  padding:"10px 16px", fontSize:11, fontWeight:700, color:"#aaa", width:"44%" }}>PRODUCTO</th>
              <th style={{ textAlign:"left",  padding:"10px 8px",  fontSize:11, fontWeight:700, color:"#aaa", width:"24%" }}>CATEGORÍA</th>
              <th style={{ textAlign:"right", padding:"10px 16px", fontSize:11, fontWeight:700, color:"#aaa", width:"20%" }}>PRECIO</th>
              <th style={{ width:"12%" }}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0 ? (
              <tr><td colSpan={4} style={{ padding:40, textAlign:"center", color:"#ccc", fontSize:14 }}>No se encontraron productos</td></tr>
            ) : filtered.map((p,i) => (
              <tr key={p.id} style={{ borderTop:"1px solid #f0ede6", background:i%2===0?"#fff":"#faf8f5" }}>
                <td style={{ padding:"10px 16px" }}>
                  <div style={{ fontSize:13, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.nombre}</div>
                  {p.notas && <div style={{ fontSize:11, color:"#bbb", marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.notas}</div>}
                </td>
                <td style={{ padding:"10px 8px" }}><CatBadge cat={p.categoria} /></td>
                <td style={{ padding:"10px 16px", textAlign:"right", fontSize:14, fontWeight:800, color:"#2d5016", whiteSpace:"nowrap" }}>{fmt(p.precio)}</td>
                <td style={{ padding:"10px 10px" }}>
                  <div style={{ display:"flex", gap:4, justifyContent:"flex-end" }}>
                    <button onClick={() => setModal(p)} style={{ background:"#f3f3f3", border:"none", borderRadius:7, padding:"5px 8px", cursor:"pointer", fontSize:14 }}>✏️</button>
                    <button onClick={() => setDeleting(p)} style={{ background:"#fff0f0", border:"none", borderRadius:7, padding:"5px 8px", cursor:"pointer", fontSize:14 }}>🗑️</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal!==null && <ProductModal product={modal.id?modal:null} categories={categories} onSave={saveProduct} onClose={() => setModal(null)} />}
      {catModal && <CatModal categories={categories} products={products} onSave={handleCatAction} onClose={() => setCatModal(false)} />}
      {deleting && (
        <div className="overlay">
          <div className="modal" style={{ maxWidth:360 }}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:8 }}>Eliminar producto</div>
            <div style={{ fontSize:13, color:"#666", marginBottom:20 }}>¿Seguro que querés eliminar <strong>{deleting.nombre}</strong>?</div>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={() => setDeleting(null)} style={{ padding:"8px 16px", borderRadius:8, border:"1px solid #ddd", background:"#fff", fontSize:13 }}>Cancelar</button>
              <button onClick={() => del(deleting.id)} style={{ padding:"8px 18px", borderRadius:8, border:"none", background:"#A32D2D", color:"#fff", fontSize:13, fontWeight:600 }}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function App() {
  const isPublic   = isPublicView();
  const urlState   = isPublic ? getStateFromURL() : null;
  const products   = urlState?.products   || load(KEYS.products,   DEFAULT_PRODUCTS);
  const categories = urlState?.categories || load(KEYS.categories, DEFAULT_CATEGORIES);
  return isPublic ? <PublicView products={products} categories={categories} /> : <Catalogo />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
